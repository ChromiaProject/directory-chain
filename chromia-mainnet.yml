definitions:
  chain_version: &chain_version
    release_version: ${RELEASE_VERSION:-dev}
    release_commit: ${RELEASE_COMMIT:-dev}
blockchains:
  mainnet:
    module: management_chain_mainnet
    config:
      config_consensus_strategy: HEADER_HASH
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      signers:
        - x"037434C8D4F2B7B7DE44E80486A814676DC3D898FD4488E10E1940B1C4C5837200"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
          global:
            topics:
              - G_create_cluster
              - G_create_container
              - G_upgrade_container
              - G_assign_subnode_image_to_container
              - G_stop_container
              - G_restart_container
              - G_remove_container
              - G_register_dapp_provider
              - G_change_dapp_providers_state
    moduleArgs:
      common.init:
        initial_provider: 0319852651DB3ACA5D5DFDF71D8600566345FE1713BCBC7F2C1B6434B7A8C88C6F
        genesis_node:
          - 037434C8D4F2B7B7DE44E80486A814676DC3D898FD4488E10E1940B1C4C5837200
          - system.chromaway.com
          - 9870
          - https://system.chromaway.com:7740
          - SE
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      proposal_blockchain.util: # Please update doc/Mainnet-Blockchain-Configuration-Limits.md and notify docs team if you modify these
        max_config_path_depth: 10
        max_config_size: 5242880 # 5 MiB
        max_block_size: 27262976 # 26 MiB
        min_inter_block_interval: 1000
        min_fast_revolt_status_timeout: 2000
        allowed_dapp_chain_gtx_modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.web.WebStaticGTXModuleFactory"
        allowed_dapp_chain_sync_exts:
          - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
          - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      chain_version: *chain_version
  system_anchoring:
    module: anchoring_chain_system
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 300000
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
    moduleArgs:
      chain_version: *chain_version
    test:
      modules:
        - anchoring_chain_system.test
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 300000
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
    moduleArgs:
      chain_version: *chain_version
    test:
      modules:
        - anchoring_chain_cluster.test
      moduleArgs:
        anchoring_chain_cluster:
          imcf_headers_with_messages_query_limit: 3 # Good for testing limits
  economy_chain_prod:
    module: economy_chain_prod
    config:
      config_consensus_strategy: HEADER_HASH
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - 'net.postchain.eif.EifGTXModule'
          - "net.postchain.d1.iccf.IccfGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_node_availability_report
          directory-chain:
            topics:
              - L_create_cluster_error
              - L_ticket_container_result
              - L_cluster_update
              - L_provider_update
              - L_provider_auth_update
              - L_node_update
              - L_cluster_node_update
              - L_blockchain_rid_topic
              - L_subnode_image_update
              - L_cluster_subnode_image_update
          global:
            topics:
              - G_evm_transaction_submitter_cost_topic
              - G_token_price_changed
          local:
            - topic: L_evm_block_events
              bc-rid: x"51857CBDE9E58410BF371F8C1E480129D15939E5F98E03575B106702D7972C17"
      eif:
        snapshot:
          levels_per_page: 2
          snapshots_to_keep: 2
    moduleArgs:
      lib.hbridge:
        evm_read_offsets:
          "56": 100
          "1": 50
      lib.ft4.core.accounts:
        rate_limit:
          active: 1
          max_points: 20
          recovery_time: 5000
          points_at_account_creation: 1
      lib.ft4.core.auth:
        evm_signatures_authorized_operations:
          - eif.hbridge.link_evm_eoa_account
      lib.ft4.core.accounts.strategies.transfer:
        rules:
          - sender_blockchain:
              - "4EED8C21E3AAB544F172945859E466E55CE3E60180D0C314DB648658CE8DC2A6" # chr repl -c '("EVM",1,x"8A2279d4A90B6fe1C4B30fa660cC9f926797bAA2").hash()' - token address from https://gitlab.com/chromaway/core/postchain-eif/-/blob/dev/postchain-eif-contracts/tasks/deployers/chromiabridge.ts?ref_type=heads#L21-L34
              - "BB3B3F342048A851B994BFD29995AF5F0B7C1D3E604F1A53C1E164677FA108BF" # chr repl -c '("EVM",56,x"f9CeC8d50f6c8ad3Fb6dcCEC577e05aA32B224FE").hash()' - token address from https://gitlab.com/chromaway/core/postchain-eif/-/blob/dev/postchain-eif-contracts/tasks/deployers/chromiabridge.ts?ref_type=heads#L21-L34
            sender: "*"
            recipient: "*"
            asset:
              - name: "Chromia" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 10
            strategy: "open"
          - sender_blockchain: "$"
            sender: "*"
            recipient: "*"
            asset:
              - name: "Chromia" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 365
            strategy: "fee"
      lib.ft4.core.accounts.strategies.transfer.fee:
        asset:
          - name: "Chromia"  # Should match `economy_chain_module_args.asset_name`
            amount: 10000000L # 10.0 CHR
        fee_account: x"A97CEAF65C5D7BE1B1307B0CD11AC9B3DB7065D24B8C1D36B135C68A846A4426" # pool account
      economy_chain:
        bsc_asset_network_id: 56
        bsc_asset_address: "f9CeC8d50f6c8ad3Fb6dcCEC577e05aA32B224FE"
        eth_asset_network_id: 1
        eth_asset_address: "8A2279d4A90B6fe1C4B30fa660cC9f926797bAA2"
        asset_name: "Chromia"
        asset_symbol: "CHR"
        asset_decimals: 6
        asset_icon: "https://assets.chromia.com/chr.png"
        pool_amount_to_mint: 150000000000 # 150k CHR
        staking_withdrawal_delay_ms: 1209600000 # 14 days
        staking_delegation_delay_ms: 604800000 # 7 days
        staking_rewards_payout_interval_ms: 86400000 # 1 day
        staking_withdrawals_payout_interval_ms: 30000 # 60 seconds (approximately every other block)
        staking_rewards_payout_batch_size: 50
        staking_rewards_share: 0.1
        staking_rewards_start_time: 1727182800000 # Tues Sep 24 2024 15:00:00 GMT+0200 (Central European Summer Time)
        pool_refill_limit_ms: 86400000 # 1 day
        max_dapp_providers_per_lease: 50
        max_bridge_leases_per_container: 10
        evm_transaction_submitters_bonus: 0.1
        container_removal_timeout: 15778800000 # 6 months
      chain_version: *chain_version
