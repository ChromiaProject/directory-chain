            asset_address: "f9CeC8d50f6c8ad3Fb6dcCEC577e05aA32B224FE"
            bridge_address: "c5B2d0F1F659A72c3c94E6E654C859771161eFD3"
            skip_to_height: 7743093
          - network_id: 1
