              - bc-rid: x"44DD7379901AA3517BC83D85F071ED6A18D409151FC8A222FCE2DE1AEE621F53" # evm_transaction_submitter_chain
                topic: G_evm_transaction_submitter_cost_topic
              - bc-rid: x"1C80EC35F3B9BBE5B516CCAD2E6B69FD3961FC1D8DB980E13F97BB5C21CF0AEB" # price_oracle_chain
