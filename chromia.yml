blockchains:
  manager:
    module: management_chain_directory1
    config:
      << : *common_config
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
    moduleArgs:
      common.init: *common_init
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      proposal_blockchain.util: *proposal_blockchain_util
      chain_version: *chain_version
  devnet:
    module: management_chain_devnet
    config: *common_config
    moduleArgs:
      common.init: *common_init
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      auth_service:
        pubkey: x"02B6F2967CF9AFC4D289EF475A2C2DDEC9EAB79AC60C1C99683E3134074619E635"
        include_system_cluster: true
      proposal_blockchain.util: *proposal_blockchain_util
      chain_version: *chain_version

  questnet:
    module: management_chain_questnet
    config: *common_config
    moduleArgs:
      common.init: *common_init
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      proposal_blockchain.util: *proposal_blockchain_util
      chain_version: *chain_version
  system_anchoring:
    module: anchoring_chain_system
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 300000
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
    moduleArgs:
      chain_version: *chain_version
    test:
      modules:
        - anchoring_chain_system.test
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 300000
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      revolt:
        fast_revolt_status_timeout: 2000
        revolt_when_should_build_block: true
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
    moduleArgs:
      chain_version: *chain_version
    test:
      modules:
        - anchoring_chain_cluster.test
      moduleArgs:
        anchoring_chain_cluster:
          imcf_headers_with_messages_query_limit: 3 # Good for testing limits
  economy_chain_test:
    module: economy_chain_test
    config:
      <<: *common_economy_chain
    moduleArgs:
      <<: *economy_chain_ft4_module_args
      <<: *economy_chain_test_claim_tchr_args
      economy_chain:
        <<: *economy_chain_module_args
        staking_withdrawal_delay_ms: 120000 # 2 min (should be double the delegation delay)
        staking_delegation_delay_ms: 60000 # 1 min
        staking_rewards_payout_interval_ms: 100000 # 100 seconds - Good for testing
        staking_rewards_payout_batch_size: 10
        staking_withdrawals_payout_interval_ms: 2000 # 2 seconds - Good for testing
      economy_chain_test_admin:
        # TODO set proper pubkey for admin for test networks
        admin_pubkey: x"0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6"
      economy_chain_test_auth_server:
        # TODO set proper pubkey for admin for test networks
        admin_pubkey: x"0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6"
      economy_chain_test_mint_on_ras_staking:
        amount_to_mint: 1000000000
      chain_version: *chain_version
    test:
      modules:
        - economy_chain.test
        - economy_chain.test.economy_chain_operations_test
        - common_proposal.test
        - economy_chain_test_claim_tchr.test
        - economy_chain_test_auth_server.test
        - economy_chain_test_admin.test
      moduleArgs:
        <<: *economy_chain_test_module_args
  economy_chain_alt_config_test:
    module: economy_chain_alt_config_test
    config:
      <<: *common_economy_chain
    moduleArgs:
      <<: *economy_chain_ft4_module_args
      <<: *economy_chain_test_claim_tchr_args
      economy_chain:
        <<: *economy_chain_module_args
        staking_rewards_payout_interval_ms: 10000 # 10 seconds - So we blow up on a zero payments
        staking_rewards_payout_batch_size: 1
        staking_rewards_start_time: 2524608000000 # Sat Jan 01 2050 00:00:00 GMT+0000
      economy_chain_test_admin:
        # TODO set proper pubkey for admin for test networks
        admin_pubkey: x"0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6"
      economy_chain_test_auth_server:
        # TODO set proper pubkey for admin for test networks
        admin_pubkey: x"0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6"
      economy_chain_test_mint_on_ras_staking:
        amount_to_mint: 1000000000
      economy_chain_alt_config_test:
        auth_privkey: x"B563C2BCC29FD0E014FBFC4AF3A69CB6C513C1943DB9A91093886DE18DCBE6C6"  # Only for tests
        admin_privkey: x"D223C1BEF057A86FCB4603BF8CCBF7FFBFAF1F1928ADBD52A8FCCD08E3C487C3"  # Only for tests
        staking_delegation_delay_ms: 604800000
    test:
      modules:
        - economy_chain_alt_config_test.test
      moduleArgs:
        <<: *economy_chain_test_module_args
        economy_chain:
          <<: *economy_chain_module_args
  economy_chain_questnet:
    module: economy_chain_questnet
    config:
      << : *common_economy_chain
    moduleArgs:
      << : *economy_chain_ft4_module_args_questnet
      << : *economy_chain_test_claim_tchr_args
      economy_chain:
        << : *economy_chain_module_args
      economy_chain_test_auth_server:
        # TODO set proper pubkey for admin for test networks
        admin_pubkey: x"0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6"
      economy_chain_test_mint_on_ras_staking:
        amount_to_mint: 1000000000
      chain_version: *chain_version
database: # Used for running tests
  logSqlErrors: true
  schema: chain0test
  driver: org.postgresql.Driver

test:
  modules:
    - anchoring_chain_common.test
    - cm_api.test
    - common.test
    - common.queries.test
    - direct_cluster.test
    - direct_container.test
    - economy_chain_in_directory_chain.test
    - evm_transaction_submitter.test
    - evm_event_receiver_price_oracle.test
    - price_oracle.test
    - lib.test
    - nm_api.test
    - proposal.test
    - proposal.voting.test
    - proposal_blockchain.test
    - proposal_blockchain_import.test
    - proposal_blockchain_move.test
    - proposal_cluster.test
    - proposal_cluster_anchoring.test
    - proposal_container.test
    - proposal_provider.test
    - proposal_voter_set.test
    - proposal_subnode_image.test
    - region.test
    - roles.test
    - delay.test
    - common_consensus.test
    - migration.test
    - provider_auth.test
    - evm_event_receiver.test
    - blockchain_auth.test
  moduleArgs:
    common.init: *common_init
    common:
      allow_blockchain_dependencies: true
      provider_quota_max_actions_per_day: 100
    proposal_blockchain.util:
      max_config_path_depth: 10
      max_config_size: 10240 # 10 KiB, low so we can test limits easier
      max_block_size: 27262976 # 26 MiB
      min_inter_block_interval: 1000
      min_fast_revolt_status_timeout: 2000
      allowed_dapp_chain_gtx_modules:
        - "net.postchain.rell.module.RellPostchainModuleFactory"
        - "net.postchain.gtx.StandardOpsGTXModule"
        - "net.postchain.d1.icmf.IcmfSenderGTXModule"
        - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
        - "net.postchain.d1.iccf.IccfGTXModule"
        - "net.postchain.eif.EifGTXModule"
        - "net.postchain.web.WebStaticGTXModuleFactory"
      allowed_dapp_chain_sync_exts:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
