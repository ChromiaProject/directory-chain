          recipient: "*"
          asset:
            - name: "Chromia Test" # Should match `economy_chain_module_args.asset_name`
              min_amount: 10000000L # 10.0 tCHR
          timeout_days: 10
          strategy: "open"
        - sender_blockchain: "$"
          sender: "*"
          recipient: "*"
          asset:
            - name: "Chromia Test" # Should match `economy_chain_module_args.asset_name`
              min_amount: 10000000L # 10.0 tCHR
          timeout_days: 10
          strategy: "fee"
    lib.ft4.core.accounts.strategies.transfer.fee:
      asset:
        - name: "Chromia Test"  # Should match `economy_chain_module_args.asset_name`
          amount: 10000000L # 10.0 tCHR
      fee_account: x"ADA12B87EAB1C6FCA6E99781A6059E1763E868BAEC5F5385DFCA6C308CF1D605" # pool account
    lib.auth:
